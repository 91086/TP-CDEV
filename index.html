<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASE CERO</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="icon" sizes="512x512" href="assets/images/favicon.png">
</head>
<body>
    
    <canvas id="miCanvas"></canvas>
    
    <div id="instructions-message" style="display: none;"></div>

    <div id="game-timer" aria-live="polite" style="display: none;"></div>

    <div id="interaction-label" class="interaction-label"></div>

    <div id="start-screen" class="start-screen">
        <h1 class="game-title">FASE CERO</h1>
        <button id="start-btn" disabled>START</button> 
    </div>

    <div class="task-grid" style="display: none;">
        <div id="task-message"></div>
        <div class="outlet-body">
            <div class="terminal-container australian-style">
                <div id="terminal-neutro" class="terminal terminal-slot terminal-top-left" data-type="neutro"></div> 
                <div id="terminal-fase" class="terminal terminal-slot terminal-top-right" data-type="fase"></div>
                <div id="terminal-tierra" class="terminal terminal-slot terminal-bottom" data-type="tierra"></div>
            </div>
        </div>
        
        <div class="wire-area">
            <div id="wire-marrón" class="draggable wire-marrón wire-strip" data-wire="fase"></div>
            <div id="wire-azul" class="draggable wire-azul wire-strip" data-wire="neutro"></div>
            <div id="wire-verde" class="draggable wire-verde wire-strip" data-wire="tierra"></div>
        </div>
    </div>

    <div id="game-over-screen" class="start-screen" style="display: none;">
        <h1 class="game-title">GAME OVER</h1>
        <button id="retry-btn">RESTART</button>
    </div>

    <div id="electric-shock-effect" class="electric-shock-effect"></div>

    <script src="libs/three.min.js"></script>
    <script type="module" src="/timer.js"></script> 
    <script type="module" src="/main.js"></script> 

    <script type="module">
        import { audioAlarma, updateGameInstructions } from './main.js';
        const startButton = document.getElementById("start-btn");
        const gameTitle = document.querySelector(".game-title");
        const startScreen = document.getElementById("start-screen");
        const gameTimer = document.getElementById('game-timer');
        const canvas = document.getElementById("miCanvas");
        
        if (startButton.hasAttribute('disabled')) startButton.removeAttribute("disabled");

        startButton.addEventListener("click", () => {
            if (gameTitle) gameTitle.style.display = "none";
            if (startButton) startButton.style.display = "none";
            if (startScreen) startScreen.style.display = "none";
            updateGameInstructions('inicioJuego');

            // Solicitar pointer lock al hacer click en el canvas
            canvas.requestPointerLock = canvas.requestPointerLock || canvas.mozRequestPointerLock || canvas.webkitRequestPointerLock;
            if (canvas.requestPointerLock) {
                canvas.requestPointerLock();
                audioAlarma.play();
            }
        });
    </script>
</body>
</html>
